[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qpilot"
version = "0.1.0"
description = "Open, validated qPCR analysis that shows which of your choices could change the conclusion. Research use only."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
authors = [{ name = "qPilot contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Runtime dependencies of the full planned stack (engine, app, MCP server). Several are not
# imported yet; they are declared up front so every module can be built against one environment.
dependencies = [
  "lxml>=6.1.3",
  "numpy",
  "scipy",
  "pandas",
  "pydantic>=2",
  "mcp>=1.23.0",
  "gradio>=5",
  "plotly",
  "pyyaml",
  "filelock",
]

[project.optional-dependencies]
dev = [
  "build",
  "pytest",
  "pytest-socket",
  "ruff",
  "mypy",
  "pre-commit",
  "pip-licenses",
  "cyclonedx-bom",
]
ai = ["anthropic", "httpx"]
parquet = ["pyarrow"]
xlsx = ["openpyxl"]

[project.scripts]
qpilot = "qpilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["qpilot"]

[tool.hatch.build.targets.sdist]
exclude = ["tests/fixtures/*.rdml"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^qpilot/vendor/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "lxml.*"
ignore_missing_imports = true
